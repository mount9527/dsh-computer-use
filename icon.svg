<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Computer use">
  <title>Computer use</title>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f3a4d"/>
      <stop offset="1" stop-color="#1d2531"/>
    </linearGradient>
  </defs>
  <!-- monitor -->
  <rect x="4.5" y="6.5" width="39" height="26" rx="4" fill="url(#screen)" stroke="#0f141c" stroke-width="1.6"/>
  <!-- stand -->
  <path d="M24 32.5v5.5M15.5 39.5h17" stroke="#0f141c" stroke-width="2.6" stroke-linecap="round"/>
  <!-- cursor arrow -->
  <path d="M13 13.5l10.5 6.2-4.6 1.3 2.6 5.4-2.6 1.2-2.6-5.4-3.3 3.2z"
        fill="#8fd3ff" stroke="#0b1b26" stroke-width="1.1" stroke-linejoin="round"/>
  <!-- verified check -->
  <path d="M28 17.5l3.4 3.6 7-7.2" fill="none" stroke="#3ddc97" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- shield badge: guardrails -->
  <path d="M33.5 22.2l6.6 2.3v5.1c0 4.2-2.7 7.3-6.6 8.6-3.9-1.3-6.6-4.4-6.6-8.6v-5.1z"
        fill="#2f7de1" stroke="#0f1d2e" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M30.6 29.6l2.2 2.3 4-4.2" fill="none" stroke="#ffffff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
